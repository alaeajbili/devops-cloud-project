services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/tasks
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    volumes:
      - pgdata:/var/lib/postgresql/data

  # À lancer seulement à partir de la semaine 2 :
  #   docker compose --profile aws up -d
  localstack:
    image: localstack/localstack:3
    profiles: ["aws"]
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,iam,sqs,ec2,sts,dynamodb
    volumes:
      - localstack:/var/lib/localstack

volumes:
  pgdata:
  localstack:
